          type: boolean
          description: Set `true` to re-send signature request via phone number SMS.
          default: false
        reply_to:
          type: string
          description: Specify Reply-To address to use in the notification emails.
        completed:
          type: boolean
          description: Pass `true` to mark submitter as completed and auto-signed
            via API.
        metadata:
          type: object
          description: Metadata object with additional submitter information.
          examples:
          - '{ "customField": "value" }'
        completed_redirect_url:
          type: string
          description: Submitter specific URL to redirect to after the submission
            completion.
        require_phone_2fa:
          type: boolean
          description: Set to `true` to require phone 2FA verification via a one-time
            code sent to the phone number in order to access the documents.
          default: false
        require_email_2fa:
          type: boolean
          description: Set to `true` to require email 2FA verification via a one-time
            code sent to the email address in order to access the documents.
          default: false
        message:
          "$ref": "#/components/schemas/UpdateSubmitterMessageParams"
        fields:
          type: array
          description: A list of configurations for template document form fields.
          items:
            "$ref": "#/components/schemas/UpdateSubmitterFieldParams"
    SubmitterUpdateResult:
      type: object
      required:
      - id
      - submission_id
      - uuid
      - email
      - slug
      - sent_at
      - opened_at
      - completed_at
      - declined_at
      - created_at
      - updated_at
      - name
      - phone
      - status
      - external_id
      - metadata
      - preferences
      - values
      - documents
      - role
      - embed_src
      properties:
        id:
          type: integer
          description: Submitter unique ID number.
        submission_id:
          type: integer
          description: Submission unique ID number.
        uuid:
          type: string
          description: Submitter UUID.
        email:
          type:
          - string
          - 'null'
          description: The email address of the submitter.
        slug:
          type: string
          description: Unique key to be used in the form signing link and embedded
            form.
        sent_at:
          type:
          - string
          - 'null'
          description: The date and time when the signing request was sent to the
            submitter.
        opened_at:
          type:
          - string
          - 'null'
          description: The date and time when the submitter opened the signing form.
        completed_at:
          type:
          - string
          - 'null'
          description: The date and time when the submitter completed the signing
            form.
        declined_at:
          type:
          - string
          - 'null'
          description: The date and time when the submitter declined the signing form.
        created_at:
          type: string
          description: The date and time when the submitter was created.
        updated_at:
          type: string
          description: The date and time when the submitter was last updated.
        name:
          type:
          - string
          - 'null'
          description: The name of the submitter.
        phone:
          type:
          - string
          - 'null'
          description: The phone number of the submitter.
        status:
          description: The status of signing request for the submitter.
          "$ref": "#/components/schemas/SubmitterStatus"
        external_id:
          type:
          - string
          - 'null'
          description: Your application-specific unique string key to identify this
            submitter within your app.
        metadata:
          type: object
          description: Metadata object with additional submitter information.
        preferences:
          type: object
          description: Submitter preferences.
        values:
          type: array
          description: An array of pre-filled values for the submitter.
          items:
            "$ref": "#/components/schemas/FieldValue"
        documents:
          type: array
          description: An array of completed or signed documents by the submitter.
          items:
            "$ref": "#/components/schemas/Document"
        role:
          type: string
          description: The role of the submitter in the signing process.
        embed_src:
          type: string
          description: The `src` URL value to embed the signing form or sign via a
            link.
    SubmitterList:
      type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Submitter"
        pagination:
          "$ref": "#/components/schemas/Pagination"
    UpdateTemplateDocumentsRequest:
      type: object
      properties:
        documents:
          type: array
          description: The list of documents to add or replace in the template.
          items:
            "$ref": "#/components/schemas/UpdateTemplateDocumentsDocumentParams"
        merge:
          type: boolean
          default: false
          description: Set to `true` to merge all existing and new documents into
            a single PDF document in the template.
    CloneTemplateRequest:
      type: object
      properties:
        name:
          type: string
          description: Template name. Existing name with (Clone) suffix will be used
            if not specified.
          examples:
          - Cloned Template
        folder_name:
          type: string
          description: The folder's name to which the template should be cloned.
        external_id:
          type: string
          description: Your application-specific unique string key to identify this
            template within your app.
    CreateTemplateFromHtmlRequest:
      type: object
      required: []
      properties:
        html:
          type: string
          description: HTML template with field tags.
          examples:
          - |
            <p>Lorem Ipsum is simply dummy text of the
            <text-field
              name="Industry"
              role="First Party"
              required="false"
              style="width: 80px; height: 16px; display: inline-block; margin-bottom: -4px">
            </text-field>
            and typesetting industry</p>
        html_header:
          type: string
          description: HTML template of the header to be displayed on every page.
        html_footer:
          type: string
          description: HTML template of the footer to be displayed on every page.
        name:
          type: string
          description: Template name. Random uuid will be assigned when not specified.
          examples:
          - Test Template
        size:
          default: Letter
          description: Page size. Letter 8.5 x 11 will be assigned when not specified.
          "$ref": "#/components/schemas/PageSize"
          examples:
          - A4
        external_id:
          type: string
          description: Your application-specific unique string key to identify this
            template within your app. Existing template with specified `external_id`
            will be updated with a new HTML.
          examples:
          - 714d974e-83d8-11ee-b962-0242ac120002
        folder_name:
          type: string
          description: The folder's name in which the template should be created.
        shared_link:
          type: boolean
          description: Set to `true` to make the template available via a shared link.
            This will allow anyone with the link to create a submission from this
            template.
          default: true
        documents:
          type: array
          description: The list of documents built from HTML. Can be used to create
            a template with multiple documents. Leave `documents` param empty when
            using a top-level `html` param for a template with a single document.
          items:
            "$ref": "#/components/schemas/CreateTemplateFromHtmlDocumentParams"
    CreateTemplateFromDocxRequest:
      type: object
      required:
      - documents
      properties:
        name:
          type: string
          description: Name of the template.
          examples:
          - Test DOCX
        external_id:
          type: string
          description: Your application-specific unique string key to identify this
            template within your app. Existing template with specified `external_id`
            will be updated with a new document.
          examples:
          - unique-key
        folder_name:
          type: string
          description: The folder's name in which the template should be created.
        shared_link:
          type: boolean
          description: Set to `true` to make the template available via a shared link.
            This will allow anyone with the link to create a submission from this
            template.
          default: true
        documents:
          type: array
          description: An array of DOCX documents to create a template.
          items:
            "$ref": "#/components/schemas/CreateTemplateFromDocxDocumentParams"
    CreateTemplateFromPdfRequest:
      type: object
      required:
      - documents
      properties:
        name:
          type: string
          description: Name of the template.
          examples:
          - Test PDF
        folder_name:
          type: string
          description: The folder's name in which the template should be created.
        external_id:
          type: string
          description: Your application-specific unique string key to identify this
            template within your app. Existing template with specified `external_id`
            will be updated with a new PDF.
          examples:
          - unique-key
        shared_link:
          type: boolean
          description: Set to `true` to make the template available via a shared link.
            This will allow anyone with the link to create a submission from this
            template.
          default: true
        documents:
          type: array
          description: An array of PDF documents to create a template.
          items:
            "$ref": "#/components/schemas/CreateTemplateFromPdfDocumentParams"
        flatten:
          type: boolean
          description: Remove PDF form fields from the documents.
          default: false
        remove_tags:
          type: boolean
          description: Pass `false` to disable the removal of {{text}} tags from the
            PDF. This can be used along with transparent text tags for faster and
            more robust PDF processing.
          default: true
    MergeTemplateRequest:
      type: object
      required:
      - template_ids
      properties:
        template_ids:
          type: array
          description: An array of template ids to merge into a new template.
          items:
            type: integer
          examples:
          - - 321
            - 432
        name:
          type: string
          description: Template name. Existing name with (Merged) suffix will be used
            if not specified.
          examples:
          - Merged Template
        folder_name:
          type: string
          description: The name of the folder in which the merged template should
            be placed.
        external_id:
          type: string
          description: Your application-specific unique string key to identify this
            template within your app.
        shared_link:
          type: boolean
          description: Set to `true` to make the template available via a shared link.
            This will allow anyone with the link to create a submission from this
            template.
          default: true
        roles:
          type: array
          description: An array of submitter role names to be used in the merged template.
          items:
            type: string
          examples:
          - - Agent
            - Customer
tags:
- name: Submissions
  description: Signature requests can be initiated with Submissions API. Submissions
    can contain one submitter if signed by a single party or multiple submitters if
    the document template form contains signatures and fields to be collected and
    filled by multiple parties. Initiate new submissions to request signatures for
    specified submitters via email or phone number.
- name: Submitters
  description: Submitters API allows you to load all details provided by the signer
    of the document.
- name: Templates
  description: Templates represent reusable document signing forms with fields and
    signatures to be collected. It's possible to create unique template forms with
    fields and signatures using HTML or with tagged PDFs.
paths:
  "/templates":
    get:
      security:
      - AuthToken: []
      tags:
      - Templates
      summary: List all templates
      description: The API endpoint provides the ability to retrieve a list of available
        document templates.
      operationId: getTemplates
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Filter templates based on the name partial match.
      - name: slug
        in: query
        required: false
        schema:
          type: string
        description: Filter templates by unique slug.
        example: opaKWh8WWTAcVG
      - name: external_id
        in: query
        required: false
        schema:
          type: string
        description: The unique application-specific identifier provided for the template
          via API or Embedded template form builder. It allows you to receive only
          templates with your specified external ID.
      - name: folder
        in: query
        required: false
        schema:
          type: string
        description: Filter templates by folder name.
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
        description: List only archived templates instead of active ones.
      - name: shared
        in: query
        required: false
        schema:
          type: boolean
        description: List templates shared with test mode.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: The number of templates to return. Default value is 10. Maximum
          value is 100.
      - name: after
        in: query
        required: false
        schema:
          type: integer
        description: The unique identifier of the template to start the list from.
          It allows you to receive only templates with an ID greater than the specified
          value. Pass ID value from the `pagination.next` response to load the next
          batch of templates.
      - name: before
        in: query
        required: false
        schema:
          type: integer
        description: The unique identifier of the template to end the list with. It
          allows you to receive only templates with an ID less than the specified
          value.

---
openapi: 3.1.0
servers:
- url: https://api.docuseal.com
  description: Global Server
- url: https://api.docuseal.eu
  description: EU Server
info:
  version: 1.0.0
  title: DocuSeal API
  description: DocuSeal API specs
  contact:
    name: DocuSeal
    email: admin@docuseal.com
    url: https://www.docuseal.com
components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    CreateSubmissionSubmitterFieldValidationParams:
      type: object
      description: Field validation rules.
      properties:
        pattern:
          type: string
          description: HTML field validation pattern string based on https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/pattern
            specification.
          examples:
          - "[A-Z]{4}"
        message:
          type: string
          description: A custom error message to display on validation failure.
        min:
          oneOf:
          - type: number
          - type: string
          description: Minimum allowed number value or date depending on field type.
        max:
          oneOf:
          - type: number
          - type: string
          description: Maximum allowed number value or date depending on field type.
        step:
          type: number
          description: Increment step for number field. Pass 1 to accept only integers,
            or 0.01 to accept decimal currency.
    CreateSubmissionSubmitterFieldPreferencesParams:
      type: object
      description: Field display preferences.
      properties:
        font_size:
          type: integer
          description: Font size of the field value in pixels.
          examples:
          - 12
        font_type:
          description: Font type of the field value.
          "$ref": "#/components/schemas/FieldFontType"
        font:
          description: Font family of the field value.
          "$ref": "#/components/schemas/FieldFont"
        color:
          type: string
          description: Font color of the field value.
          examples:
          - black
          - white
          - blue
          - "#FF0000"
          default: black
        background:
          type: string
          description: Field box background color.
          examples:
          - black
          - white
          - blue
          - "#FF0000"
        align:
          description: Horizontal alignment of the field text value.
          "$ref": "#/components/schemas/FieldAlign"
          default: left
        valign:
          description: Vertical alignment of the field text value.
          "$ref": "#/components/schemas/FieldValign"
          default: center
        format:
          type: string
          description: 'The data format for different field types.<br>- Date field:
            accepts formats such as DD/MM/YYYY (default: MM/DD/YYYY).<br>- Signature
            field: accepts drawn, typed, drawn_or_typed (default), or upload.<br>-
            Number field: accepts currency formats such as usd, eur, gbp.'
          examples:
          - DD/MM/YYYY
        price:
          type: number
          description: Price value of the payment field. Only for payment fields.
          examples:
          - 99.99
        currency:
          description: Currency value of the payment field. Only for payment fields.
          "$ref": "#/components/schemas/Currency"
          default: USD
        mask:
          description: Set `true` to make sensitive data masked on the document.
          oneOf:
          - type: integer
          - type: boolean
          default: false
        reasons:
          description: An array of signature reasons to choose from.
          type: array
          items:
            type: string
    CreateSubmissionSubmitterFieldParams:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Document template field name.
          examples:
          - First Name
        default_value:
          "$ref": "#/components/schemas/DefaultValue"
        readonly:
          type: boolean
          description: Set `true` to make it impossible for the submitter to edit
            predefined field value.
          default: false
        required:
          type: boolean
          description: Set `true` to make the field required.
        title:
          type: string
          description: Field title displayed to the user instead of the name, shown
            on the signing form. Supports Markdown.
        description:
          type: string
          description: Field description displayed on the signing form. Supports Markdown.
        validation:
          "$ref": "#/components/schemas/CreateSubmissionSubmitterFieldValidationParams"
        preferences:
          "$ref": "#/components/schemas/CreateSubmissionSubmitterFieldPreferencesParams"
    CreateSubmissionSubmitterMessageParams:
      type: object
      description: Custom signature request email message for the submitter.
      properties:
        subject:
          type: string
          description: Custom signature request email subject for the submitter.
        body:
          type: string
          description: Custom signature request email body for the submitter. Can
            include variables such as {{template.name}}, {{submission.name}}, {{submitter.link}},
            {{account.name}}.
    CreateSubmissionSubmitterParams:
      type: object
      properties:
        name:
          type: string
          description: The name of the submitter.
        role:
          type: string
          description: The role name or title of the submitter.
          examples:
          - First Party
        email:
          type: string
          description: The email address of the submitter.
          format: email
          examples:
          - john.doe@example.com
        phone:
          type: string
          description: The phone number of the submitter, formatted according to the
            E.164 standard.
          examples:
          - "+1234567890"
        values:
          type: object
          description: An object with pre-filled values for the submission. Use field
            names for keys of the object. For more configurations see `fields` param.
        external_id:
          type: string
          description: Your application-specific unique string key to identify this
            submitter within your app.
        completed:
          type: boolean
          description: Pass `true` to mark submitter as completed and auto-signed
            via API.
        metadata:
          type: object
          description: Metadata object with additional submitter information.
          examples:
          - '{ "customField": "value" }'
        send_email:
          type: boolean
          description: Set `false` to disable signature request emails sending only
            for this submitter.
          default: true
        send_sms:
          type: boolean
          description: Set `true` to send signature request via phone number and SMS.
          default: false
        reply_to:
          type: string
          description: Specify Reply-To address to use in the notification emails
            for this submitter.
        completed_redirect_url:
          type: string
          description: Submitter specific URL to redirect to after the submission
            completion.
        order:
          type: integer
          description: The order of the submitter in the workflow (e.g., 0 for the
            first signer, 1 for the second, etc.). Use the same order number to create
            order groups. By default, submitters are ordered as in the submitters
            array.
        require_phone_2fa:
          type: boolean
          description: Set to `true` to require phone 2FA verification via a one-time
            code sent to the phone number in order to access the documents.
          default: false
        require_email_2fa:
          type: boolean
          description: Set to `true` to require email 2FA verification via a one-time
            code sent to the email address in order to access the documents.
          default: false
        invite_by:
          type: string
          description: Set the role name of the previous party that should invite
            this party via email.
        message:
          "$ref": "#/components/schemas/CreateSubmissionSubmitterMessageParams"
        fields:
          type: array
          description: A list of configurations for template document form fields.
          items:
            "$ref": "#/components/schemas/CreateSubmissionSubmitterFieldParams"
        roles:
          type: array
          description: A list of roles for the submitter. Use this param to merge
            multiple roles into one submitter.
          items:
            type: string
    CreateSubmissionMessageParams:
      type: object
      description: Custom signature request email message.
      properties:
        subject:
          type: string
          description: Custom signature request email subject.
        body:
          type: string
          description: Custom signature request email body. Can include variables
            such as {{template.name}}, {{submission.name}}, {{submitter.link}}, {{account.name}}.
    CreateSubmissionDocumentFieldAreaParams:
      type: object
      required:
      - x
      - "y"
      - w
      - h
      - page
      properties:
        x:
          type: number
          description: X-coordinate of the field area.
        "y":
          type: number
          description: Y-coordinate of the field area.
        w:
          type: number
          description: Width of the field area.
        h:
          type: number
          description: Height of the field area.
        page:
          type: integer
          description: Page number of the field area. Starts from 1.
          examples:
          - 1
        option:
          type: string
          description: Option string value for `radio` and `multiple` select field
            types.
    CreateSubmissionDocumentFieldParams:
      type: object
      properties:
        name:
          type: string
          description: Name of the field.
        type:
          description: Type of the field (e.g., text, signature, date, initials).
          "$ref": "#/components/schemas/FieldType"
        role:
          type: string
          description: Role name of the signer.
        required:
          type: boolean
          description: Indicates if the field is required.
        title:
          type: string
          description: Field title displayed to the user instead of the name, shown
            on the signing form. Supports Markdown.
        description:
          type: string
          description: Field description displayed on the signing form. Supports Markdown.
        areas:
          type: array
          description: List of areas where the field is located in the document.
          items:
            "$ref": "#/components/schemas/CreateSubmissionDocumentFieldAreaParams"
        options:
          type: array
          description: An array of option values for `select` field type.
          items:
            type: string
          examples:
          - - Option A
            - Option B
    CreateSubmissionFromPdfDocumentParams:
      type: object
      required:
      - name
      - file
      properties:
        name:
          type: string
          description: Name of the document.
        file:
          examples:
          - base64
          type: string
          format: base64
          description: Base64-encoded content of the PDF file or downloadable file
            URL.
        fields:
          type: array
          description: Fields are optional if you use {{...}} text tags to define
            fields in the document.
          items:
            "$ref": "#/components/schemas/CreateSubmissionDocumentFieldParams"
        position:
          type: integer
          description: Document position in the submission. If not specified, the
            document will be added in the order it appears in the documents array.
    CreateSubmissionFromDocxDocumentParams:
      type: object
      required:
      - name
      - file
      properties:
        name:
          type: string
          description: Name of the document.
        file:
          examples:
          - base64
          type: string
          format: base64
          description: Base64-encoded content of the PDF or DOCX file or downloadable
            file URL.
        position:
          type: integer
          description: Document position in the submission. If not specified, the
            document will be added in the order it appears in the documents array.
    CreateSubmissionFromHtmlDocumentParams:
      type: object
      required:
      - html
      properties:
        name:
          type: string
          description: Document name. Random uuid will be assigned when not specified.
          examples:
          - Test Document
        html:
          type: string
          description: HTML document content with field tags.
          examples:
          - |
            <p>Lorem Ipsum is simply dummy text of the
            <text-field
              name="Industry"
              role="First Party"
              required="false"
              style="width: 80px; height: 16px; display: inline-block; margin-bottom: -4px">
            </text-field>
            and typesetting industry</p>
        html_header:
          type: string
          description: HTML document content of the header to be displayed on every
            page.
        html_footer:
          type: string
          description: HTML document content of the footer to be displayed on every
            page.
        size:
          default: Letter
          description: Page size. Letter 8.5 x 11 will be assigned when not specified.
          "$ref": "#/components/schemas/PageSize"
          examples:
          - A4
        position:
          type: integer
          description: Document position in the submission. If not specified, the
            document will be added in the order it appears in the documents array.
    UpdateSubmitterFieldParams:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Document template field name.
          examples:
          - First Name
        default_value:
          "$ref": "#/components/schemas/DefaultValue"
        readonly:
          type: boolean
          description: Set `true` to make it impossible for the submitter to edit
            predefined field value.
          default: false
        required:
          type: boolean
          description: Set `true` to make the field required.
        validation:
          "$ref": "#/components/schemas/UpdateSubmitterFieldValidationParams"
        preferences:
          "$ref": "#/components/schemas/UpdateSubmitterFieldPreferencesParams"
    UpdateSubmitterMessageParams:
      type: object
      description: Custom signature request email message.
      properties:
        subject:
          type: string
          description: Custom signature request email subject.
        body:
          type: string
          description: 'Custom signature request email body. Can include the following
            variables: {{template.name}}, {{submitter.link}}, {{account.name}}.'
    UpdateSubmitterFieldValidationParams:
      type: object
      description: Field validation rules.
      properties:
        pattern:
          type: string
          description: HTML field validation pattern string based on https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/pattern
            specification.
          examples:
          - "[A-Z]{4}"
        message:
          type: string
          description: A custom error message to display on validation failure.
        min:
          oneOf:
          - type: number
          - type: string
          description: Minimum allowed number value or date depending on field type.
        max:
          oneOf:
          - type: number
          - type: string
          description: Maximum allowed number value or date depending on field type.
        step:
          type: number
          description: Increment step for number field. Pass 1 to accept only integers,
            or 0.01 to accept decimal currency.
    UpdateSubmitterFieldPreferencesParams:
      type: object
      description: Field display preferences.
      properties:
        font_size:
          type: integer
          description: Font size of the field value in pixels.
          examples:
          - 12
        font_type:
          description: Font type of the field value.
          "$ref": "#/components/schemas/FieldFontType"
        font:
          description: Font family of the field value.
          "$ref": "#/components/schemas/FieldFont"
        color:
          type: string
          description: Font color of the field value.
          examples:
          - black
          - white
          - blue
          - "#FF0000"
          default: black
        background:
          type: string
          description: Field box background color.
          examples:
          - black
          - white
          - blue
          - "#FF0000"
        align:
          description: Horizontal alignment of the field text value.
          "$ref": "#/components/schemas/FieldAlign"
          default: left
        valign:
          description: Vertical alignment of the field text value.
          "$ref": "#/components/schemas/FieldValign"
          default: center
        format:
          type: string
          description: 'The data format for different field types.<br>- Date field:
            accepts formats such as DD/MM/YYYY (default: MM/DD/YYYY).<br>- Signature
            field: accepts drawn, typed, drawn_or_typed (default), or upload.<br>-
            Number field: accepts currency formats such as usd, eur, gbp.'
          examples:
          - DD/MM/YYYY
        price:
          type: number
          description: Price value of the payment field. Only for payment fields.
          examples:
          - 99.99
        currency:
          description: Currency value of the payment field. Only for payment fields.
          "$ref": "#/components/schemas/Currency"
          default: USD
        mask:
          description: Set `true` to make sensitive data masked on the document.
          oneOf:
          - type: integer
          - type: boolean
          default: false
        reasons:
          description: An array of signature reasons to choose from.
          type: array
          items:
            type: string
    UpdateTemplateDocumentsDocumentParams:
      type: object
      properties:
        name:
          type: string
          description: Document name. Random uuid will be assigned when not specified.
          examples:
          - Test Template
        file:
          type: string
          format: base64
          description: Base64-encoded content of the PDF or DOCX file or downloadable
            file URL. Leave it empty if you create a new document using HTML param.
        html:
          type: string
          description: HTML template with field tags. Leave it empty if you add a
            document via PDF or DOCX base64 encoded file param or URL.
        position:
          type: integer
          description: Position of the document. By default will be added as the last
            document in the template.
          examples:
          - 0
        replace:
          type: boolean
          default: false
          description: Set to `true` to replace existing document with a new file
            at `position`. Existing document fields will be transferred to the new
            document if it doesn't contain any fields.
        remove:
          type: boolean
          default: false
          description: Set to `true` to remove existing document at given `position`
            or with given `name`.
    CreateTemplateFromHtmlDocumentParams:
      type: object
      required:
      - html
      properties:
        html:
          type: string
          description: HTML template with field tags.
          examples:
          - |
            <p>Lorem Ipsum is simply dummy text of the
            <text-field
              name="Industry"
              role="First Party"
              required="false"
              style="width: 80px; height: 16px; display: inline-block; margin-bottom: -4px">
            </text-field>
            and typesetting industry</p>
        name:
          type: string
          description: Document name. Random uuid will be assigned when not specified.
          examples:
          - Test Document
    CreateTemplateDocumentFieldValidationParams:
      type: object
      description: Field validation rules.
      properties:
        pattern:
          type: string
          description: HTML field validation pattern string based on https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/pattern
            specification.
          examples:
          - "[A-Z]{4}"
        message:
          type: string
          description: A custom error message to display on validation failure.
        min:
          oneOf:
          - type: number
          - type: string
          description: Minimum allowed number value or date depending on field type.
        max:
          oneOf:
          - type: number
          - type: string
          description: Maximum allowed number value or date depending on field type.
        step:
          type: number
          description: Increment step for number field. Pass 1 to accept only integers,
            or 0.01 to accept decimal currency.
    CreateTemplateDocumentFieldPreferencesParams:
      type: object
      description: Field display preferences.
      properties:
        font_size:
          type: integer
          description: Font size of the field value in pixels.
          examples:
          - 12
        font_type:
          description: Font type of the field value.
          "$ref": "#/components/schemas/FieldFontType"
        font:
          description: Font family of the field value.
          "$ref": "#/components/schemas/FieldFont"
        color:
          type: string
          description: Font color of the field value.
          examples:
          - black
          - white
          - blue
          - "#FF0000"
          default: black
        background:
          type: string
          description: Field box background color.
          examples:
          - black
          - white
          - blue
          - "#FF0000"
        align:
          description: Horizontal alignment of the field text value.
          "$ref": "#/components/schemas/FieldAlign"
          default: left
        valign:
          description: Vertical alignment of the field text value.
          "$ref": "#/components/schemas/FieldValign"
          default: center
        format:
          type: string
          description: 'The data format for different field types.<br>- Date field:
            accepts formats such as DD/MM/YYYY (default: MM/DD/YYYY).<br>- Signature
            field: accepts drawn, typed, drawn_or_typed (default), or upload.<br>-
            Number field: accepts currency formats such as usd, eur, gbp.'
          examples:
          - DD/MM/YYYY
        price:
          type: number
          description: Price value of the payment field. Only for payment fields.
          examples:
          - 99.99
        currency:
          description: Currency value of the payment field. Only for payment fields.
          "$ref": "#/components/schemas/Currency"
          default: USD
        mask:
          description: Set `true` to make sensitive data masked on the document.
          oneOf:
          - type: integer
          - type: boolean
          default: false
        reasons:
          description: An array of signature reasons to choose from.
          type: array
          items:
            type: string
    CreateTemplateDocumentFieldAreaParams:
      type: object
      required:
      - x
      - "y"
      - w
      - h
      - page
      properties:
        x:
          type: number
          description: X-coordinate of the field area.
        "y":
          type: number
          description: Y-coordinate of the field area.
        w:
          type: number
          description: Width of the field area.
        h:
          type: number
          description: Height of the field area.
        page:
          type: integer
          description: Page number of the field area. Starts from 1.
          examples:
          - 1
        option:
          type: string
          description: Option string value for `radio` and `multiple` select field
            types.
    CreateTemplateDocumentFieldParams:
      type: object
      properties:
        name:
          type: string
          description: Name of the field.
        type:
          description: Type of the field (e.g., text, signature, date, initials).
          "$ref": "#/components/schemas/FieldType"
        role:
          type: string
          description: Role name of the signer.
        required:
          type: boolean
          description: Indicates if the field is required.
        title:
          type: string
          description: Field title displayed to the user instead of the name, shown
            on the signing form. Supports Markdown.
        description:
          type: string
          description: Field description displayed on the signing form. Supports Markdown.
        areas:
          type: array
          description: List of areas where the field is located in the document.
          items:
            "$ref": "#/components/schemas/CreateTemplateDocumentFieldAreaParams"
        options:
          type: array
          description: An array of option values for `select` field type.
          items:
            type: string
          examples:
          - - Option A
            - Option B
        validation:
          "$ref": "#/components/schemas/CreateTemplateDocumentFieldValidationParams"
        preferences:
          "$ref": "#/components/schemas/CreateTemplateDocumentFieldPreferencesParams"
    CreateTemplateFromDocxDocumentParams:
      type: object
      required:
      - name
      - file
      properties:
        name:
          type: string
          description: Name of the document.
        file:
          type: string
          examples:
          - base64
          format: base64
          description: Base64-encoded content of the DOCX file or downloadable file
            URL.
        dynamic:
          type: boolean
          description: Set to `true` to make the document dynamic. When enabled, the
            DOCX document content can be edited or use [[variables]] in the template
            editor.
          default: false
        fields:
          description: Fields are optional if you use {{...}} text tags to define
            fields in the document.
          type: array
          items:
            "$ref": "#/components/schemas/CreateTemplateDocumentFieldParams"
    CreateTemplateFromPdfDocumentParams:
      type: object
      required:
      - name
      - file
      properties:
        name:
          type: string
          description: Name of the document.
        file:
          examples:
          - base64
          type: string
          format: base64
          description: Base64-encoded content of the PDF file or downloadable file
            URL.
        fields:
          type: array
          description: Fields are optional if you use {{...}} text tags to define
            fields in the document.
          items:
            "$ref": "#/components/schemas/CreateTemplateDocumentFieldParams"
    Pagination:
      type: object
      required:
      - count
      - next
      - prev
      properties:
        count:
          type: integer
          description: Items count.
        next:
          type:
          - integer
          - 'null'
          description: The ID of the item after which the next page starts.
        prev:
          type:
          - integer
          - 'null'
          description: The ID of the item before which the previous page ends.
    SubmissionEvent:
      type: object
      required:
      - id
      - submitter_id
      - event_type
      - event_timestamp
      properties:
        id:
          type: integer
          description: Submission event unique ID number.
        submitter_id:
          type: integer
          description: Unique identifier of the submitter that triggered the event.
        event_type:
          description: Event type.
          "$ref": "#/components/schemas/SubmissionEventType"
        event_timestamp:
          type: string
          description: Date and time when the event was triggered.
        data:
          type: object
          description: Additional event details object.
    Document:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
          description: Document name.
        url:
          type: string
          description: Document URL.
    FieldValue:
      type: object
      required:
      - field
      - value
      properties:
        field:
          type: string
          description: Document template field name.
        value:
          oneOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - type: array
            items:
              oneOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
          - type: 'null'
          description: Pre-filled value of the field.
    DefaultValueItem:
      oneOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
    DefaultValue:
      oneOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
      - type: array
        items:
          "$ref": "#/components/schemas/DefaultValueItem"
      description: Default value of the field. Use base64 encoded file or a public
        URL to the image file to set default signature or image fields.
      examples:
      - Acme
    TemplateSummary:
      type: object
      required:
      - id
      - name
      - external_id
      - folder_name
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier of the document template.
        name:
          type: string
          description: The name of the template.
        external_id:
          type:
          - string
          - 'null'
          description: Your application-specific unique string key to identify this
            template within your app.
        folder_name:
          type: string
          description: Folder name where the template is located.
        created_at:
          type: string
          description: The date and time when the template was created.
        updated_at:
          type: string
          description: The date and time when the template was last updated.
    User:
      type: object
      required:
      - id
      - first_name

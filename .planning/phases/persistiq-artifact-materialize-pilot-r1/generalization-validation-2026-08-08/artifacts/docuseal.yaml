      required:
      - template_id
      - emails
      properties:
        template_id:
          type: integer
          description: The unique identifier of the template.
          examples:
          - 1000001
        emails:
          type: string
          description: A comma-separated list of email addresses to send the submission
            to.
          examples:
          - "{{emails}}"
        send_email:
          type: boolean
          description: Set `false` to disable signature request emails sending.
          default: true
        message:
          "$ref": "#/components/schemas/CreateSubmissionMessageParams"
    CreateSubmissionFromPdfRequest:
      type: object
      required:
      - documents
      - submitters
      properties:
        name:
          type: string
          description: Name of the document submission.
          examples:
          - Test Submission Document
        send_email:
          type: boolean
          description: Set `false` to disable signature request emails sending.
          default: true
        send_sms:
          type: boolean
          description: Set `true` to send signature request via phone number and SMS.
          default: false
        order:
          description: Pass `random` to send signature request emails to all parties
            right away. The order is `preserved` by default so the second party will
            receive a signature request email only after the document is signed by
            the first party.
          default: preserved
          "$ref": "#/components/schemas/SubmittersOrder"
        completed_redirect_url:
          type: string
          description: Specify URL to redirect to after the submission completion.
        bcc_completed:
          type: string
          description: Specify BCC address to send signed documents to after the completion.
        reply_to:
          type: string
          description: Specify Reply-To address to use in the notification emails.
        expire_at:
          type: string
          description: Specify the expiration date and time after which the submission
            becomes unavailable for signature.
          examples:
          - 2024-09-01 12:00:00 UTC
        template_ids:
          type: array
          description: An optional array of template IDs to use in the submission
            along with the provided documents. This can be used to create multi-document
            submissions when some of the required documents exist within templates.
          items:
            type: integer
            description: The ID of the template to use for the submission.
        documents:
          type: array
          description: An array of PDF documents to create a submission.
          items:
            "$ref": "#/components/schemas/CreateSubmissionFromPdfDocumentParams"
        submitters:
          type: array
          description: The list of submitters for the submission.
          items:
            "$ref": "#/components/schemas/CreateSubmissionSubmitterParams"
        message:
          "$ref": "#/components/schemas/CreateSubmissionMessageParams"
        flatten:
          type: boolean
          description: Remove PDF form fields from the documents.
          default: false
        merge_documents:
          type: boolean
          description: Set `true` to merge the documents into a single PDF file.
          default: false
        remove_tags:
          type: boolean
          description: Pass `false` to disable the removal of {{text}} tags from the
            PDF. This can be used along with transparent text tags for faster and
            more robust PDF processing.
          default: true

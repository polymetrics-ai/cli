stages:
  - website-test
  - website-build
  - website-deploy

variables:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"
  WEBSITE_DIR: "website"
  WEBSITE_IMAGE: "$CI_REGISTRY_IMAGE/website:$CI_COMMIT_SHA"
  WEBSITE_MAIN_IMAGE: "$CI_REGISTRY_IMAGE/website:main"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

.website_rules:
  rules: &website_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - website/**/*
        - internal/connectors/icon_data.json
        - docs/connectors/icons/**/*
        - .gitlab-ci.yml
        - .github/workflows/website.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - website/**/*
        - internal/connectors/icon_data.json
        - docs/connectors/icons/**/*
        - .gitlab-ci.yml
        - .github/workflows/website.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'

# The generated website data is derived from the connector bundles, so this
# check runs on bundle changes too, and stays out of `website:test` so that
# wider trigger costs only a Node container. Mirrors
# .github/workflows/website-data.yml.
website:data:
  stage: website-test
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &website_data_changes
        - website/**/*
        - internal/connectors/defs/**/*
        - internal/connectors/icon_data.json
        - docs/connectors/icons/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *website_data_changes
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git
  script:
    # `npm run` needs no dependency install: the generators import only `node:`
    # builtins, and package.json stays the single owner of the generator list.
    - npm --prefix "$WEBSITE_DIR" run gen:website-data
    - |
      changed="$(git status --porcelain)"
      if [ -n "$changed" ]; then
        printf 'generated website data is stale; run `cd website && pnpm run gen:website-data` and commit the result\n'
        printf '%s\n' "$changed"
        git diff
        exit 1
      fi

website:test:
  stage: website-test
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  rules: *website_rules
  before_script:
    - npm install --global "pnpm@$PNPM_VERSION"
  script:
    - cd "$WEBSITE_DIR"
    - pnpm install --frozen-lockfile --reporter=silent
    # Also checked by `website:data`, which carries the wider connector-bundle
    # trigger. Kept here too because `website:image` and `website:deploy` chain
    # off this job. Repo-wide rather than a hand-listed file set: an enumerated
    # list goes stale the moment a generator gains an output.
    - pnpm run gen:website-data
    - |
      changed="$(git status --porcelain)"
      if [ -n "$changed" ]; then
        printf 'generated website data is stale; run `cd website && pnpm run gen:website-data` and commit the result\n'
        printf '%s\n' "$changed"
        git diff
        exit 1
      fi
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run test:unit
    - pnpm run test:scripts
    - pnpm run test:e2e
    - pnpm run build

website:image:
  stage: website-build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  rules: *website_rules
  needs:
    - website:test
  script:
    - docker build --pull -f "$WEBSITE_DIR/Dockerfile" -t "$WEBSITE_IMAGE" "$WEBSITE_DIR"
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
        docker push "$WEBSITE_IMAGE"
        docker tag "$WEBSITE_IMAGE" "$WEBSITE_MAIN_IMAGE"
        docker push "$WEBSITE_MAIN_IMAGE"
      fi

website:deploy:
  stage: website-deploy
  image:
    name: bitnami/kubectl:1.33
    entrypoint: [""]
  tags:
    - tailscale
    - polymetrics-website
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - website/**/*
        - internal/connectors/icon_data.json
        - docs/connectors/icons/**/*
        - .gitlab-ci.yml
        - .github/workflows/website.yml
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
  needs:
    - website:image
  environment:
    name: website-production
  script:
    - |
      if [ -n "${WEBSITE_KUBECONFIG_B64:-}" ]; then
        mkdir -p "$HOME/.kube"
        printf '%s' "$WEBSITE_KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
      fi
    - sh website/deploy/deploy-image.sh "$WEBSITE_IMAGE"

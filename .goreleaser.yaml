version: 2

project_name: pm

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

release:
  mode: keep-existing
  replace_existing_artifacts: true

builds:
  # pm embeds DuckDB: it is the query engine and the only Parquet implementation
  # in the binary, so cgo is required rather than optional. go-duckdb bundles a
  # static library for darwin, linux/{amd64,arm64} and windows/amd64, but none
  # for windows/arm64 — that target is therefore not buildable and is ignored
  # below rather than silently produced without a working warehouse. The
  # windows/amd64 build runs on Windows-on-ARM under emulation.
  - id: pm
    main: ./cmd/pm
    binary: pm
    env:
      - CGO_ENABLED=1
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X polymetrics.ai/internal/cli.version={{ .Version }}
      - -X polymetrics.ai/internal/cli.commit={{ .Commit }}
      - -X polymetrics.ai/internal/cli.buildDate={{ .CommitDate }}

archives:
  - id: pm
    ids:
      - pm
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md

nfpms:
  - id: linux_packages
    package_name: pm
    ids:
      - pm
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ if eq .Format \"rpm\" }}{{ if eq .Arch \"amd64\" }}x86_64{{ else if eq .Arch \"arm64\" }}aarch64{{ else }}{{ .Arch }}{{ end }}{{ else }}{{ .Arch }}{{ end }}{{ .ConventionalExtension }}"
    vendor: Polymetrics AI
    homepage: https://cli.polymetrics.ai
    maintainer: Polymetrics AI
    description: |-
      Local-first data CLI for ETL, embedded DuckDB SQL, reverse ETL,
      scheduling, and AI-agent-safe automation.
    license: AGPL-3.0-only
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    release: 1
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pm/LICENSE
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        dst: /usr/share/doc/pm/NOTICE
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^style"
      - "^ci"

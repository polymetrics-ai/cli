name: Release

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-check:
    name: package-check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build snapshot release assets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Verify release assets
        run: ./scripts/verify-release-assets.sh dist

      - name: Create offline trust-evidence fixtures
        run: ./scripts/create-release-trust-fixtures.sh dist

      - name: Verify offline trust-evidence fixtures
        env:
          ALLOW_UNSIGNED_TRUST_FIXTURES: "1"
          REQUIRE_TRUST_EVIDENCE: "1"
        run: ./scripts/verify-release-assets.sh dist

      - name: Test Linux package installation
        run: ./scripts/test-linux-packages.sh dist

  release-assets:
    name: release-assets
    needs: release-please
    if: >-
      ${{
        always() &&
        (github.event_name == 'release' ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: release-assets-${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check existing release assets
        id: existing-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          asset_count=$(gh release view "$TAG_NAME" --json assets --jq '[.assets[] | select(.name == "checksums.txt" or .name == "checksums.txt.sigstore.json" or (.name | startswith("pm_")))] | length')
          case "$asset_count" in
            0)
              echo "skip_release_assets=false" >> "$GITHUB_OUTPUT"
              ;;
            22)
              printf 'release %s already has the complete PM asset set; skipping duplicate upload\n' "$TAG_NAME"
              echo "skip_release_assets=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'release %s already has %s PM assets; refusing to overwrite a partial or mismatched set\n' "$TAG_NAME" "$asset_count" >&2
              exit 1
              ;;
          esac

      - name: Export reproducible package timestamp
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Go
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Install package inspection tools
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build release assets without publishing
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish

      - name: Capture release trust subjects
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: ./scripts/verify-release-assets.sh dist --print-subjects > "$RUNNER_TEMP/release-trust-subjects.txt"

      - name: Test Linux package installation
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: ./scripts/test-linux-packages.sh dist

      - name: Generate GitHub SLSA provenance attestations
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/pm_*.tar.gz
            dist/pm_*.zip
            dist/pm_*.deb
            dist/pm_*.rpm
            dist/checksums.txt

      - name: Install cosign
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Generate Cosign keyless bundles
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          while IFS= read -r subject; do
            test -n "$subject" || continue
            cosign sign-blob "$subject" --bundle "$subject.sigstore.json" --yes
          done < "$RUNNER_TEMP/release-trust-subjects.txt"

      - name: Verify release assets and trust evidence
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          GITHUB_ATTESTATION_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          GITHUB_ATTESTATION_REPO: ${{ github.repository }}
          REQUIRE_TRUST_EVIDENCE: "1"
          VERIFY_GITHUB_ATTESTATIONS: "1"
        run: ./scripts/verify-release-assets.sh dist

      - name: Upload verified assets to published release
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          published_tag=$(gh release view "$TAG_NAME" --json isDraft,tagName --jq 'select(.isDraft == false) | .tagName')
          test "$published_tag" = "$TAG_NAME"
          assets=()
          while IFS= read -r subject; do
            test -n "$subject" || continue
            assets+=("$subject" "$subject.sigstore.json")
          done < "$RUNNER_TEMP/release-trust-subjects.txt"
          gh release upload "$TAG_NAME" "${assets[@]}"

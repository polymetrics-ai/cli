name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".gitlab-ci.yml"
  pull_request:
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".gitlab-ci.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      pm_cli_release_created: ${{ steps.release.outputs.release_created == 'true' && contains(steps.release.outputs.paths_released, '"."') }}
      pm_release_input: ${{ steps.pm-release-filter.outputs.pm_release_input }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout release calculation history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PM CLI release input
        id: pm-release-filter
        run: >-
          ./scripts/release-please-pm-filter.py
          --target-branch main
          --filtered-repo "$RUNNER_TEMP/pm-release-filtered"
          --github-output "$GITHUB_OUTPUT"

      - name: Create GitHub release from release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Create or update release PR from filtered PM history
        if: steps.pm-release-filter.outputs.pm_release_input == 'true'
        env:
          RELEASE_PLEASE_AUTH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          FILTERED_RELEASE_REPO: ${{ steps.pm-release-filter.outputs.filtered_repo }}
        shell: bash
        run: |
          set -euo pipefail
          npx -y release-please@17.6.0 release-pr \
            --repo-url "$GITHUB_REPOSITORY" \
            --token <(printf '%s' "$RELEASE_PLEASE_AUTH_TOKEN") \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --target-branch main \
            --path . \
            --local \
            --local-path "$FILTERED_RELEASE_REPO"

  # Pull requests exercise the packaging path on Linux only, on the two free
  # standard Linux runners. pm embeds DuckDB, so every target is a cgo build and
  # cannot be cross-compiled from one host; running the full five-runner matrix
  # on every PR would be the expensive way to learn that. deb/rpm are where the
  # packaging risk actually lives and they are Linux-only anyway, so this keeps
  # the real install/uninstall test while leaving macOS and Windows to releases.
  package-check-binaries:
    name: package-check-binaries (${{ matrix.goarch }})
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build pm natively
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          mkdir -p "binaries/linux_${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w" -o "binaries/linux_${{ matrix.goarch }}/pm" ./cmd/pm

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-check_linux_${{ matrix.goarch }}
          path: binaries/linux_${{ matrix.goarch }}/pm
          retention-days: 1
          if-no-files-found: error

  package-check:
    name: package-check
    if: ${{ github.event_name == 'pull_request' }}
    needs: package-check-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Download natively built binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-check_*
          path: binaries

      - name: Restore the layout the assembler expects
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "binaries/linux_$arch"
            mv "binaries/package-check_linux_$arch/pm" "binaries/linux_$arch/pm"
            chmod +x "binaries/linux_$arch/pm"
          done
          ls -R binaries

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install nfpm
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          # setup-go does not add GOPATH/bin to PATH in this repository's jobs —
          # verify.yml does the same thing explicitly for golangci-lint. Without
          # this line the binary exists but is invisible, and the failure only
          # surfaces later as "nfpm was not found on PATH" from inside the
          # assembler, which reads like a packaging fault rather than a missing
          # PATH entry. GoReleaser used to provide nfpm implicitly.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Confirm nfpm is on PATH
        run: nfpm --version

      - name: Assemble Linux release assets
        run: |
          set -euo pipefail
          ./scripts/assemble-release-assets.sh \
            --version 0.0.0-snapshot \
            --binaries binaries \
            --out dist \
            --targets linux/amd64,linux/arm64

      - name: Set up QEMU for Linux package tests
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Test Linux package installation
        run: ./scripts/test-linux-packages.sh dist

  # Every release target is built on a runner of its own OS. pm embeds DuckDB,
  # so this is a cgo build and there is no supported way to produce darwin and
  # windows artifacts from a Linux host: a zig cross toolchain cannot link
  # go-duckdb's prebuilt C++ archives, and GoReleaser OSS cannot assemble
  # archives from binaries built elsewhere. Standard GitHub-hosted runners are
  # free for public repositories on every OS, so the fan-out costs nothing.
  #
  # This runs only for a real release, never on a pull request.
  release-binaries:
    name: release-binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: release-please
    if: >-
      ${{
        always() &&
        (github.event_name == 'release' ||
         needs.release-please.outputs.pm_cli_release_created == 'true')
      }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build pm natively
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG_NAME: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          binary=pm
          mkdir -p "binaries/${GOOS}_${GOARCH}"
          # ldflags match .goreleaser.yaml's build block exactly, so a binary
          # from this matrix reports the same version, commit and date the
          # previous single-host build produced.
          go build -trimpath \
            -ldflags "-s -w -X polymetrics.ai/internal/cli.version=$version -X polymetrics.ai/internal/cli.commit=$(git rev-parse HEAD) -X polymetrics.ai/internal/cli.buildDate=$(git log -1 --format=%cI)" \
            -o "binaries/${GOOS}_${GOARCH}/$binary" ./cmd/pm
          "binaries/${GOOS}_${GOARCH}/$binary" version || true

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release_${{ matrix.goos }}_${{ matrix.goarch }}
          path: binaries/${{ matrix.goos }}_${{ matrix.goarch }}/*
          retention-days: 1
          if-no-files-found: error

  release-assets:
    name: release-assets
    needs: [release-please, release-binaries]
    if: >-
      ${{
        always() &&
        (github.event_name == 'release' ||
         needs.release-please.outputs.pm_cli_release_created == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: release-assets-${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    outputs:
      homebrew_notification_ready: ${{ steps.homebrew-notification.outputs.ready }}
      tag_name: ${{ steps.release-metadata.outputs.tag_name }}
      release_version: ${{ steps.release-metadata.outputs.release_version }}
      release_component: ${{ steps.release-metadata.outputs.release_component }}
      release_id: ${{ steps.release-metadata.outputs.release_id }}
      source_run_id: ${{ steps.homebrew-source-run.outputs.source_run_id }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Resolve release metadata
        id: release-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_version="${TAG_NAME#v}"
          if [[ "$release_version" == "$TAG_NAME" ]]; then
            printf 'release tag must start with v: %s\n' "$TAG_NAME" >&2
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag must be a canonical PM CLI semver tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi
          ./scripts/verify-release-assets.sh --release-version "$release_version" --print-expected-release-assets >/dev/null
          release_json=$(gh release view "$TAG_NAME" --json databaseId,isDraft,tagName)
          release_id=$(RELEASE_JSON="$release_json" TAG_NAME="$TAG_NAME" python3 - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          if release.get("tagName") != os.environ["TAG_NAME"] or release.get("isDraft") is not False:
              raise SystemExit("release metadata did not resolve to the published tag")
          release_id = release.get("databaseId")
          if not isinstance(release_id, int):
              raise SystemExit("release metadata did not include a numeric databaseId")
          print(release_id)
          PY
          )
          {
            echo "tag_name=$TAG_NAME"
            echo "release_version=$release_version"
            echo "release_component=pm-cli"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"

      - name: Check existing release assets
        id: existing-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-metadata.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          expected_assets=$(./scripts/verify-release-assets.sh --release-version "$release_version" --print-expected-release-assets | LC_ALL=C sort)
          actual_assets=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [[ -z "$actual_assets" ]]; then
            echo "skip_release_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            printf 'release %s has unexpected assets; refusing to overwrite or skip\n' "$TAG_NAME" >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          download_args=()
          while IFS= read -r asset; do
            download_args+=(--pattern "$asset")
          done <<<"$expected_assets"
          gh release download "$TAG_NAME" --dir "$release_dir" "${download_args[@]}"

          regex_escape() {
            python3 - "$1" <<'PY'
          import re
          import sys

          print(re.escape(sys.argv[1]))
          PY
          }
          workflow_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          main_identity="${workflow_identity}@refs/heads/main"
          tag_identity="${workflow_identity}@refs/tags/${TAG_NAME}"
          identity_regexp="^($(regex_escape "$main_identity")|$(regex_escape "$tag_identity"))$"
          COSIGN_CERT_IDENTITY_REGEXP="$identity_regexp" \
            GITHUB_ATTESTATION_CERT_IDENTITY_REGEX="$identity_regexp" \
            GITHUB_ATTESTATION_REPO="$GITHUB_REPOSITORY" \
            REQUIRE_TRUST_EVIDENCE=1 \
            VERIFY_GITHUB_ATTESTATIONS=1 \
            ./scripts/verify-release-assets.sh "$release_dir" \
              --release-version "$release_version" \
              --require-exact-release-assets

          printf 'release %s already has the exact verified PM asset set; skipping duplicate upload\n' "$TAG_NAME"
          echo "skip_release_assets=true" >> "$GITHUB_OUTPUT"

      - name: Export reproducible package timestamp
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Go
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download natively built release binaries
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release_*
          path: release-binaries

      - name: Restore the layout the assembler expects
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: |
          set -euo pipefail
          mkdir -p binaries
          for dir in release-binaries/release_*; do
            target="${dir#release-binaries/release_}"
            mkdir -p "binaries/$target"
            cp "$dir"/* "binaries/$target/"
            chmod +x "binaries/$target"/* || true
          done
          ls -R binaries

      - name: Install nfpm
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          # See the identical step in package-check: GOPATH/bin is not on PATH
          # by default here. A release must not discover that at tag time.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Confirm nfpm is on PATH
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: nfpm --version

      - name: Assemble release assets
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          ./scripts/assemble-release-assets.sh \
            --version "$RELEASE_VERSION" \
            --binaries binaries \
            --out dist

      - name: Capture release trust subjects
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: ./scripts/verify-release-assets.sh dist --print-subjects > "$RUNNER_TEMP/release-trust-subjects.txt"

      - name: Set up QEMU for Linux package tests
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Test Linux package installation
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        run: ./scripts/test-linux-packages.sh dist

      - name: Generate GitHub SLSA provenance attestations
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/pm_*.tar.gz
            dist/pm_*.deb
            dist/pm_*.rpm
            dist/checksums.txt

      - name: Generate Cosign keyless bundles
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          while IFS= read -r subject; do
            test -n "$subject" || continue
            cosign sign-blob "$subject" --bundle "$subject.sigstore.json" --yes
          done < "$RUNNER_TEMP/release-trust-subjects.txt"

      - name: Verify release assets and trust evidence
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          GITHUB_ATTESTATION_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          GITHUB_ATTESTATION_REPO: ${{ github.repository }}
          REQUIRE_TRUST_EVIDENCE: "1"
          VERIFY_GITHUB_ATTESTATIONS: "1"
        run: ./scripts/verify-release-assets.sh dist

      - name: Upload verified assets to published release
        if: steps.existing-assets.outputs.skip_release_assets != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail
          published_tag=$(gh release view "$TAG_NAME" --json isDraft,tagName --jq 'select(.isDraft == false) | .tagName')
          test "$published_tag" = "$TAG_NAME"
          assets=()
          while IFS= read -r subject; do
            test -n "$subject" || continue
            assets+=("$subject" "$subject.sigstore.json")
          done < "$RUNNER_TEMP/release-trust-subjects.txt"
          gh release upload "$TAG_NAME" "${assets[@]}"

      - name: Mark Homebrew dry-run notification ready
        id: homebrew-notification
        if: ${{ success() }}
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve Homebrew notification source run
        id: homebrew-source-run
        if: ${{ success() }}
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          SKIP_RELEASE_ASSETS: ${{ steps.existing-assets.outputs.skip_release_assets }}
        run: |
          set -euo pipefail
          if [[ "$SKIP_RELEASE_ASSETS" == "true" ]]; then
            echo "source_run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "source_run_id=$CURRENT_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

  notify-homebrew-tap:
    name: notify-homebrew-tap-dry-run
    needs: release-assets
    if: >-
      ${{
        github.repository == 'polymetrics-ai/cli' &&
        needs.release-assets.outputs.release_component == 'pm-cli' &&
        needs.release-assets.outputs.homebrew_notification_ready == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-notify-${{ needs.release-assets.outputs.tag_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout trusted notification helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Request Homebrew formula update dry-run
        env:
          PM_HOMEBREW_PR_APP_ID: ${{ secrets.PM_HOMEBREW_PR_APP_ID }}
          PM_HOMEBREW_PR_PRIVATE_KEY: ${{ secrets.PM_HOMEBREW_PR_PRIVATE_KEY }}
          SOURCE_RUN_ID: ${{ needs.release-assets.outputs.source_run_id }}
        run: |
          set -euo pipefail
          source_run_args=()
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            source_run_args=(--source-run-id "$SOURCE_RUN_ID")
          fi
          ./scripts/notify-homebrew-formula-update.sh \
            --release-assets-verified "${{ needs.release-assets.outputs.homebrew_notification_ready }}" \
            --tag "${{ needs.release-assets.outputs.tag_name }}" \
            --release-id "${{ needs.release-assets.outputs.release_id }}" \
            "${source_run_args[@]}" \
            --source-repo polymetrics-ai/cli \
            --tap-repo polymetrics-ai/homebrew-tap \
            --workflow pm-formula-update.yml \
            --dispatch-schema pm-homebrew-formula/v1 \
            --target-commitish-policy ignore \
            --dry-run true \
            --dispatch

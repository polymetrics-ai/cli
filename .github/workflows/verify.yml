name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: Certify harness timing
        run: make certify-timing

      - name: Verify
        run: make verify

      - name: Check generated files
        run: git diff --exit-code

  # pm embeds DuckDB, so every release target must actually link cgo against
  # go-duckdb's bundled library. That is verifiable only on a native runner:
  # cross-compiling cgo to Windows or macOS from Linux needs a toolchain CI does
  # not have, and a cross-build that fails for toolchain reasons looks exactly
  # like a target that is unsupported. This job is what says which targets are
  # real, and it is why the release matrix drops windows/arm64 and nothing else.
  native-build:
    name: native-build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest
          - target: windows-amd64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Build pm with the embedded DuckDB engine
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" ./cmd/pm

      - name: Prove the engine and the warehouse format on this target
        env:
          CGO_ENABLED: '1'
        run: go test -timeout 20m -run 'TestWarehouseMaterializesTablesAsParquet|TestQuerySQLAggregatesOverParquetTables|TestReverseETLReadsAParquetSourceTable' ./internal/app/

  # windows/arm64 is the one target go-duckdb ships no library for. Asserting
  # that here means the release matrix's single exclusion stays justified by a
  # fact rather than by a comment, and that a future go-duckdb release adding
  # the library shows up as a failure asking for the target back.
  windows-arm64-unsupported:
    name: windows-arm64-unsupported
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Confirm go-duckdb still ships no windows/arm64 library
        shell: bash
        run: |
          set -euo pipefail
          go mod download github.com/marcboeker/go-duckdb
          deps="$(go list -m -f '{{ .Dir }}' github.com/marcboeker/go-duckdb)/deps"
          echo "bundled libraries:"
          ls "$deps"
          if [ -d "$deps/windows_arm64" ]; then
            echo "go-duckdb now ships a windows/arm64 library; restore that release target" >&2
            exit 1
          fi
          echo "windows/arm64 remains unbuildable, so the release matrix excludes it"

  # NOT a release path, and deliberately non-blocking. Embedding DuckDB makes the
  # release build a cgo build, and `.goreleaser.yaml` still produces every target
  # from one Linux host — which worked at CGO_ENABLED=0 and cannot now.
  #
  # A first probe tried zig cc and failed on ALL five targets including
  # linux/amd64, the runner's own architecture. That ruled out zig rather than
  # cross-compiling: `libduckdb.a` is a C++ library, and the link needs a C++
  # standard library ABI-compatible with an archive built by someone else's
  # toolchain. zig supplies none such — hence `undefined symbol: typeinfo for
  # std::bad_weak_ptr` and, on darwin, a missing libresolv.
  #
  # goreleaser-cross is the other free option and a genuinely different failure
  # mode: real GCC cross toolchains with matching libstdc++ for linux, mingw-w64
  # for windows, and osxcross (clang + macOS SDK + libc++) for darwin — exactly
  # the thing that was missing. If this passes, the release stays on goreleaser
  # OSS with a container. If it fails too, no free route remains.
  cross-toolchain-probe:
    name: cross-toolchain-probe (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      # Go 1.25.9 here vs the repo's pinned 1.25.12; GOTOOLCHAIN=auto fetches the
      # pinned toolchain inside the container. The C toolchains are what is under
      # test, and they are unaffected by which Go runs.
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25.9
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show which cross compilers this image actually ships
        shell: bash
        run: |
          set -uo pipefail
          # Printed so a MISSING compiler is never mistaken for a link failure —
          # the distinction that made the zig probe conclusive.
          for cc in x86_64-linux-gnu-gcc aarch64-linux-gnu-gcc \
                    x86_64-w64-mingw32-gcc o64-clang oa64-clang; do
            printf '%-28s %s\n' "$cc" "$(command -v "$cc" || echo MISSING)"
          done
          go version

      - name: Probe each release target from this one Linux host
        shell: bash
        run: |
          set -uo pipefail
          probe() {
            local goos=$1 goarch=$2 cc=$3 cxx=$4
            echo "--- $goos/$goarch via $cc"
            if ! command -v "$cc" >/dev/null; then
              echo "RESULT $goos/$goarch: FAILED (compiler $cc not in image)"
              return
            fi
            if CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" CC="$cc" CXX="$cxx" \
               go build -o /dev/null ./cmd/pm 2>&1 | tail -20; then
              echo "RESULT $goos/$goarch: OK"
            else
              echo "RESULT $goos/$goarch: FAILED"
            fi
          }
          probe linux   amd64 x86_64-linux-gnu-gcc   x86_64-linux-gnu-g++
          probe linux   arm64 aarch64-linux-gnu-gcc  aarch64-linux-gnu-g++
          probe windows amd64 x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++
          probe darwin  amd64 o64-clang              o64-clang++
          probe darwin  arm64 oa64-clang             oa64-clang++
          echo
          echo "Every RESULT line above is the input to the release-pipeline decision."
          echo "All OK  -> run goreleaser inside this image; the release stays on"
          echo "           goreleaser OSS and the signed pipeline shape is unchanged."
          echo "Any FAIL -> no free cross route remains. goreleaser OSS cannot assemble"
          echo "           archives from prebuilt binaries (the prebuilt builder is"
          echo "           Pro-only), so the remaining choice is a paid licence or a"
          echo "           smaller published matrix."

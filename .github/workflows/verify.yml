name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: Certify harness timing
        run: make certify-timing

      - name: Verify
        run: make verify

      - name: Check generated files
        run: git diff --exit-code

  # pm embeds DuckDB, so every release target must actually link cgo against
  # go-duckdb's bundled library. That is verifiable only on a native runner:
  # cross-compiling cgo to Windows or macOS from Linux needs a toolchain CI does
  # not have, and a cross-build that fails for toolchain reasons looks exactly
  # like a target that is unsupported. This job is what says which targets are
  # real, and it is why the release matrix drops windows/arm64 and nothing else.
  native-build:
    name: native-build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest
          - target: windows-amd64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Build pm with the embedded DuckDB engine
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" ./cmd/pm

      - name: Prove the engine and the warehouse format on this target
        env:
          CGO_ENABLED: '1'
        run: go test -timeout 20m -run 'TestWarehouseMaterializesTablesAsParquet|TestQuerySQLAggregatesOverParquetTables|TestReverseETLReadsAParquetSourceTable' ./internal/app/

  # windows/arm64 is the one target go-duckdb ships no library for. Asserting
  # that here means the release matrix's single exclusion stays justified by a
  # fact rather than by a comment, and that a future go-duckdb release adding
  # the library shows up as a failure asking for the target back.
  windows-arm64-unsupported:
    name: windows-arm64-unsupported
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Confirm go-duckdb still ships no windows/arm64 library
        shell: bash
        run: |
          set -euo pipefail
          go mod download github.com/marcboeker/go-duckdb
          deps="$(go list -m -f '{{ .Dir }}' github.com/marcboeker/go-duckdb)/deps"
          echo "bundled libraries:"
          ls "$deps"
          if [ -d "$deps/windows_arm64" ]; then
            echo "go-duckdb now ships a windows/arm64 library; restore that release target" >&2
            exit 1
          fi
          echo "windows/arm64 remains unbuildable, so the release matrix excludes it"

  # NOT a release path, and deliberately non-blocking. Embedding DuckDB makes the
  # release build a cgo build, and `.goreleaser.yaml` still produces every target
  # from one Linux host — which worked at CGO_ENABLED=0 and cannot now. The
  # cheapest fix that keeps the whole signed pipeline intact is a cross
  # toolchain, and zig cc is the only one that plausibly covers all three
  # operating systems. Whether it can actually link go-duckdb's prebuilt static
  # libraries is a question no amount of reading settles, and it cannot be
  # answered on a developer Mac. So it is asked here, once, and the answer
  # decides the release orchestration instead of a guess doing it.
  cross-toolchain-probe:
    name: cross-toolchain-probe (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Probe each release target from this one Linux host
        shell: bash
        run: |
          set -uo pipefail
          probe() {
            local goos=$1 goarch=$2 target=$3
            echo "--- $goos/$goarch via zig cc -target $target"
            if CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" \
               CC="zig cc -target $target" CXX="zig c++ -target $target" \
               go build -o /dev/null ./cmd/pm 2>&1 | tail -20; then
              echo "RESULT $goos/$goarch: OK"
            else
              echo "RESULT $goos/$goarch: FAILED"
            fi
          }
          probe linux   amd64 x86_64-linux-gnu
          probe linux   arm64 aarch64-linux-gnu
          probe windows amd64 x86_64-windows-gnu
          probe darwin  amd64 x86_64-macos-none
          probe darwin  arm64 aarch64-macos-none
          echo
          echo "Every RESULT line above is the input to the release-pipeline decision."
          echo "All OK  -> add zig to the release job and keep goreleaser as it is."
          echo "Any FAIL -> that target needs a native runner, and goreleaser OSS cannot"
          echo "            assemble archives from prebuilt binaries (the prebuilt builder"
          echo "            is Pro-only), so the choice is Pro, hand-rolled packaging, or"
          echo "            a smaller published matrix."

name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      # `make verify` exercises the real Linux archive and extracted installed
      # binary proof. Its host target must assemble Linux packages too, so this
      # job owns the same pinned nfpm prerequisite as the package/release jobs;
      # do not depend on a globally installed runner tool.
      - name: Install nfpm for release workflow checks
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/nfpm" --version

      - name: Verify
        run: make verify

      - name: Check generated files
        run: git diff --exit-code

  # Hermetic GitHub fixture proofs start fresh pm binaries, including the
  # exhaustive 97 generated candidates and the released read surface. They
  # are intentionally isolated from `make verify`'s shared internal/cli
  # deadline; every behavioral assertion remains mandatory in this 45-minute
  # job while the ordinary Verify job keeps its fixed 20-minute package budget.
  github-generated-direct-read-fixture:
    name: github-generated-direct-read-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false

      # Cross-process rate-limit coordination is part of the generated command
      # proof. This job owns its disposable Redis-compatible coordinator rather
      # than relying on an ambient runner service.
      - name: Provision local coordination fixture
        run: |
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes redis-server
          fi
          redis-server --version

      - name: Exhaustive hermetic GitHub fresh-binary fixtures
        run: >-
          go test -tags github_fixture_sweep -timeout 35m -count=1 -v ./internal/cli
          -run '^(TestPMBinaryProvesGitHubSharedAdmissionForGeneratedDirectReadFixture|TestPMBinaryExecutesGitHubGeneratedDirectReadCandidatesAgainstFixture|TestPMBinaryExecutesGitHubDisputedPartialVerdictsAgainstFixture|TestPMBinaryExecutesGitHubReleasedReadSurfaceAgainstFixture|TestPMBinaryExecutesIssueLabelWarehouseTransportLifecycle|TestFreshBinaryDeclarativeGitHubWarehouseFlowRoundTrip)$'

  # pm embeds DuckDB, so every release target must actually link cgo against
  # go-duckdb's bundled library. That is verifiable only on a native runner:
  # cross-compiling cgo to Windows or macOS from Linux needs a toolchain CI does
  # not have, and a cross-build that fails for toolchain reasons looks exactly
  # like a target that is unsupported. This job is what says which targets are
  # real, and it is why the release matrix drops windows/arm64 and nothing else.
  native-build:
    name: native-build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build pm with the embedded DuckDB engine
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" ./cmd/pm

      - name: Prove the engine and the warehouse format on this target
        env:
          CGO_ENABLED: '1'
        run: go test -timeout 20m -run 'TestWarehouseMaterializesTablesAsParquet|TestQuerySQLAggregatesOverParquetTables|TestReverseETLReadsAParquetSourceTable' ./internal/app/

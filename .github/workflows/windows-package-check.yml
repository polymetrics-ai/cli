name: Windows Package Check

on:
  pull_request:
    paths:
      - '.github/workflows/windows-package-check.yml'
      - 'build/windowsversion/**'
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/windows/**'
      - 'scripts/windows-*.ps1'
      - 'scripts/verify-windows-package.ps1'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  unsigned-msi-snapshot:
    name: unsigned-msi-snapshot
    runs-on: windows-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up .NET SDK for WiX
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Run focused packaging tests
        shell: pwsh
        run: go test ./build/windowsversion ./packaging/windows ./packaging/windows/winget

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build unsigned Windows executable and MSI snapshots
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          .\scripts\windows-package.ps1 -Version '0.0.0' -OutputRoot 'dist\windows'

      - name: Verify unsigned Windows package snapshots
        shell: pwsh
        run: .\scripts\verify-windows-package.ps1 -Version '0.0.0' -DistDir 'dist\windows' -InstallX64

      - name: Record arm64 publication gate
        shell: pwsh
        run: |
          Write-Host 'arm64 executable and MSI structure were built and verified.'
          Write-Host 'Native Windows arm64 install/run/uninstall proof remains required before the first WinGet arm64 publication.'

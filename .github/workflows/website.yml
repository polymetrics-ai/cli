name: Website CI/CD

on:
  pull_request:
    paths:
      - "website/**"
      - "internal/connectors/icon_data.json"
      - "docs/connectors/icons/**"
      - ".github/workflows/website.yml"
      - ".gitlab-ci.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "internal/connectors/icon_data.json"
      - "docs/connectors/icons/**"
      - ".github/workflows/website.yml"
      - ".gitlab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # 17-alpine
        env:
          POSTGRES_DB: website
          POSTGRES_USER: website
          POSTGRES_PASSWORD: website
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U website"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://website:website@127.0.0.1:5432/website

    steps:
      - name: Configure git defaults
        working-directory: .
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      # Also checked by .github/workflows/website-data.yml, which carries the
      # wider connector-bundle trigger. Kept here too because `image` and
      # `deploy` chain off this job, so dropping it would let stale generated
      # data deploy. The check is repo-wide rather than a hand-listed file set:
      # an enumerated list goes stale the moment a generator gains an output,
      # which is how content/docs/github-cli-surface.mdx and
      # data/connectors.generated.json both ended up unchecked.
      - name: Verify generated website data
        run: |
          pnpm run gen:website-data
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            printf 'generated website data is stale; run `cd website && pnpm run gen:website-data` and commit the result\n'
            printf '%s\n' "$changed"
            git diff
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Script tests
        run: pnpm run test:scripts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

  image:
    name: Website image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image tags
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="${REGISTRY}/${repo}/website:${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}"
            if { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; } \
              && [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${REGISTRY}/${repo}/website:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          login_log="$(mktemp)"
          if ! printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin >"$login_log" 2>&1; then
            cat "$login_log"
            exit 1
          fi

      - name: Build website image
        env:
          DOCKER_BUILDKIT: "1"
          PUSH_IMAGE: ${{ github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tags+=("-t" "$tag")
            fi
          done <<< "$TAGS"

          docker build -f website/Dockerfile "${tags[@]}" website

          if [ "$PUSH_IMAGE" = "true" ]; then
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                docker push "$tag"
              fi
            done <<< "$TAGS"
          fi

  deploy:
    name: Website deploy
    runs-on: [self-hosted, linux, tailscale, polymetrics-website]
    needs: image
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.WEBSITE_DEPLOY_ENABLED == 'true'
    environment: website-production
    concurrency: website-production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Deploy website to origin Quadlet
        env:
          WEBSITE_IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          WEBSITE_SERVICE: ${{ vars.WEBSITE_SERVICE }}
          WEBSITE_QUADLET: ${{ vars.WEBSITE_QUADLET }}
          WEBSITE_HEALTH_URL: ${{ vars.WEBSITE_HEALTH_URL }}
          WEBSITE_PUBLIC_URL: ${{ vars.WEBSITE_PUBLIC_URL }}
          WEBSITE_ROLLOUT_TIMEOUT: ${{ vars.WEBSITE_ROLLOUT_TIMEOUT }}
        run: website/deploy/deploy-podman-quadlet.sh
